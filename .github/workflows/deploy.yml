name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 也允許在 GitHub 網頁上手動點擊觸發

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # 專案頁面 (repo 不叫 <user>.github.io) 網址會帶 /<repo>/ 前綴，
      # 這裡自動判斷，不用手動改設定；同時算出完整網域給 SEO 用的 meta 標籤跟 sitemap
      - name: Determine base path and site URL
        id: base
        run: |
          REPO_OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
            echo "site_url=https://$REPO_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO_NAME/" >> "$GITHUB_OUTPUT"
            echo "site_url=https://$REPO_OWNER.github.io/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES_BASE: ${{ steps.base.outputs.path }}
          SITE_URL: ${{ steps.base.outputs.site_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
