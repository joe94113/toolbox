<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      跟 public/404.html 是一組的：GitHub Pages 把找不到的路徑導來 404.html，
      404.html 把真正的路徑編碼進查詢字串轉回這裡，這段腳本負責把網址還原，
      要在 Vue Router 初始化之前就跑完，所以放在 head 最前面。
      技巧出處：https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>

    <!--
      下面這個網址請在部署到 GitHub Pages 後，換成你自己的實際網址，
      例如 https://your-username.github.io/toolbox/
      （社群分享預覽跟 og:image 需要「絕對網址」才會生效，不能用相對路徑）
    -->
    <link rel="canonical" href="https://your-username.github.io/toolbox/" />

    <title>工具箱｜貼上內容，立刻拿到你要的結果</title>
    <meta name="description" content="免安裝、免登入的線上工具箱：JSON 格式整理、色碼轉換、Hash 計算、正規表達式測試、Markdown 預覽等 18 個實用小工具，運算都在你的瀏覽器裡完成。" />
    <meta name="theme-color" content="#2F6B57" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="工具箱" />
    <meta property="og:title" content="工具箱｜貼上內容，立刻拿到你要的結果" />
    <meta property="og:description" content="免安裝、免登入的線上工具箱，JSON、色碼、Hash、正規表達式、Markdown 預覽等 18 個實用小工具。" />
    <meta property="og:url" content="https://your-username.github.io/toolbox/" />
    <meta property="og:image" content="https://your-username.github.io/toolbox/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="zh_TW" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="工具箱｜貼上內容，立刻拿到你要的結果" />
    <meta name="twitter:description" content="免安裝、免登入的線上工具箱，18 個實用小工具，運算都在瀏覽器裡完成。" />
    <meta name="twitter:image" content="https://your-username.github.io/toolbox/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
